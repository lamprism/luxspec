name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: central-release

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.0.1 # v6.0.1

      - name: Validate release version
        id: release-version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          normalized_version="${RELEASE_VERSION^^}"
          case "$normalized_version" in
            ""|*SNAPSHOT*)
              printf 'Release version must not contain SNAPSHOT: %s\n' "$RELEASE_VERSION" >&2
              exit 1
              ;;
            v*)
              printf 'Enter the release version without the v prefix: %s\n' "$RELEASE_VERSION" >&2
              exit 1
              ;;
          esac

          printf 'version=%s\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check release tag
        id: tag-state
        env:
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
        run: |
          set -euo pipefail

          if git show-ref --tags --verify --quiet "refs/tags/$RELEASE_TAG"; then
            existing_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$existing_commit" != "$GITHUB_SHA" ]; then
              printf 'Tag %s already exists on another commit.\n' "$RELEASE_TAG" >&2
              exit 1
            fi
            printf 'created=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'created=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Configure publishing credentials
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_user_home"
          {
            printf '%s\n' "luxspec.publish.username=$CENTRAL_USERNAME"
            printf '%s\n' "luxspec.publish.password=$CENTRAL_PASSWORD"
            printf '%s\n' "signing.gnupg.keyName=$GPG_KEY_ID"
            printf '%s\n' "signing.gnupg.passphrase=$GPG_PASSPHRASE"
          } >> "$gradle_user_home/gradle.properties"
          printf 'GRADLE_USER_HOME=%s\n' "$gradle_user_home" >> "$GITHUB_ENV"

      - name: Test and build release JARs
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: ./gradlew build -Pluxspec.version="$RELEASE_VERSION"

      - name: Create release tag
        if: steps.tag-state.outputs.created == 'true'
        env:
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --annotate "$RELEASE_TAG" "$GITHUB_SHA" --message "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Publish release to Central
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          CENTRAL_NAMESPACE: com.lamprism
        run: |
          set -euo pipefail

          ./gradlew publish \
            -Pluxspec.version="$RELEASE_VERSION" \
            -Pluxspec.publish.repositoryUrl=https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/ \
            -Pluxspec.publish.repositoryName=ossrhStagingApi

          auth="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w 0)"
          curl --fail-with-body --request POST \
            --header "Authorization: Bearer $auth" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/$CENTRAL_NAMESPACE?publishing_type=automatic"

      - name: Package distribution files
        id: distribution
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          set -euo pipefail

          distribution_directory="$RUNNER_TEMP/luxspec-$RELEASE_VERSION"
          archive="$RUNNER_TEMP/luxspec-$RELEASE_VERSION-distribution.zip"
          mkdir -p "$distribution_directory"

          find . -type f -path '*/build/libs/*.jar' -not -path './build-logic/*' \
            -exec cp -- {} "$distribution_directory/" \;

          jar_count="$(find "$distribution_directory" -maxdepth 1 -type f -name '*.jar' | wc -l)"
          if [ "$jar_count" -eq 0 ]; then
            printf 'No distribution JARs were produced.\n' >&2
            exit 1
          fi

          (
            cd "$distribution_directory"
            sha256sum -- *.jar > SHA256SUMS
            zip -q -r "$archive" .
          )
          sha256sum "$archive" > "$archive.sha256"

          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'checksum=%s\n' "$archive.sha256" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: release-notes
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/release-notes.md"
          previous_tag="$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)"
          {
            printf '## Changes\n\n'
            if [ -n "$previous_tag" ]; then
              git log --format='- %s (%h)' "$previous_tag..$GITHUB_SHA"
            else
              git log --format='- %s (%h)' "$GITHUB_SHA"
            fi
          } > "$notes_file"

          printf 'path=%s\n' "$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-version.outputs.tag }}
          RELEASE_NOTES: ${{ steps.release-notes.outputs.path }}
          DISTRIBUTION_ARCHIVE: ${{ steps.distribution.outputs.archive }}
          DISTRIBUTION_CHECKSUM: ${{ steps.distribution.outputs.checksum }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --draft \
            --title "$RELEASE_TAG" \
            --notes-file "$RELEASE_NOTES" \
            "$DISTRIBUTION_ARCHIVE" \
            "$DISTRIBUTION_CHECKSUM"
