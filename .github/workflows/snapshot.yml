name: Snapshot

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "**/*.md"
      - ".github/**"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Check snapshot version
        id: snapshot-version
        shell: bash
        run: |
          set -euo pipefail

          version="$(./gradlew -q printVersion)"
          normalized_version="${version^^}"
          case "$normalized_version" in
            *-SNAPSHOT)
              ;;
            *)
              printf 'Snapshot publishing requires a -SNAPSHOT version, got: %s\n' "$version" >&2
              exit 1
              ;;
          esac

          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Test and build Snapshot JARs
        run: ./gradlew build

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Configure publishing credentials
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_user_home"
          {
            printf '%s\n' "luxspec.publish.username=$CENTRAL_USERNAME"
            printf '%s\n' "luxspec.publish.password=$CENTRAL_PASSWORD"
            printf '%s\n' "signing.gnupg.keyName=$GPG_KEY_ID"
            printf '%s\n' "signing.gnupg.passphrase=$GPG_PASSPHRASE"
          } >> "$gradle_user_home/gradle.properties"
          printf 'GRADLE_USER_HOME=%s\n' "$gradle_user_home" >> "$GITHUB_ENV"

      - name: Publish Snapshot
        run: |
          ./gradlew publish \
            -Pluxspec.version="${{ steps.snapshot-version.outputs.value }}" \
            -Pluxspec.publish.repositoryUrl=https://central.sonatype.com/repository/maven-snapshots/ \
            -Pluxspec.publish.repositoryName=centralSnapshots
