name: Snapshot

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "**/*.md"
      - ".github/**"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.0.1 # v6.0.1

      - name: Check snapshot version
        id: snapshot-version
        shell: bash
        run: |
          set -euo pipefail

          version="$(./gradlew -q printVersion)"
          normalized_version="${version^^}"
          case "$normalized_version" in
            *-SNAPSHOT)
              ;;
            *)
              printf 'Snapshot publishing requires a -SNAPSHOT version, got: %s\n' "$version" >&2
              exit 1
              ;;
          esac

          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Test and build Snapshot JARs
        run: ./gradlew build

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Configure publishing credentials
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_user_home"
          python3 - "$gradle_user_home/gradle.properties" <<'PY'
          import os
          import sys

          def escape(value):
              result = []
              for index, character in enumerate(value):
                  codepoint = ord(character)
                  if character == "\\":
                      result.append("\\\\")
                  elif character == "\t":
                      result.append("\\t")
                  elif character == "\n":
                      result.append("\\n")
                  elif character == "\r":
                      result.append("\\r")
                  elif character == "\f":
                      result.append("\\f")
                  elif character in "=:#!" or (character == " " and index == 0):
                      result.append("\\" + character)
                  elif codepoint < 0x20 or codepoint > 0x7e:
                      if codepoint <= 0xffff:
                          result.append("\\u%04x" % codepoint)
                      else:
                          codepoint -= 0x10000
                          result.append("\\u%04x\\u%04x" % (
                              0xd800 + (codepoint >> 10),
                              0xdc00 + (codepoint & 0x3ff),
                          ))
                  else:
                      result.append(character)
              return "".join(result)

          properties = (
              ("luxspec.publish.username", "CENTRAL_USERNAME"),
              ("luxspec.publish.password", "CENTRAL_PASSWORD"),
              ("signing.gnupg.keyName", "GPG_KEY_ID"),
              ("signing.gnupg.passphrase", "GPG_PASSPHRASE"),
          )
          with open(sys.argv[1], "a", encoding="ascii") as output:
              for key, variable in properties:
                  output.write(key + "=" + escape(os.environ[variable]) + "\n")
          PY
          chmod 600 "$gradle_user_home/gradle.properties"
          printf 'GRADLE_USER_HOME=%s\n' "$gradle_user_home" >> "$GITHUB_ENV"

      - name: Publish Snapshot
        run: |
          ./gradlew publish \
            -Pluxspec.version="${{ steps.snapshot-version.outputs.value }}" \
            -Pluxspec.publish.repositoryUrl=https://central.sonatype.com/repository/maven-snapshots/ \
            -Pluxspec.publish.repositoryName=centralSnapshots
