name: Verify

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.0.1 # v6.0.1

      - name: Test and build JARs
        id: build
        run: ./gradlew build

      - name: Summarize build metrics
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: python3 .github/scripts/build_metrics.py

      - name: Upload JARs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luxspec-jars-${{ github.sha }}
          path: |
            **/build/libs/*.jar
            !build-logic/**
          if-no-files-found: ignore

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luxspec-jacoco-${{ github.sha }}
          path: |
            **/build/reports/jacoco/**
            !build-logic/**
          if-no-files-found: ignore

      - name: Upload test reports and file manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luxspec-test-reports-${{ github.sha }}
          path: |
            **/build/test-results/test/**/*.xml
            !build-logic/**
            ${{ runner.temp }}/luxspec-build-files.txt
          if-no-files-found: ignore
